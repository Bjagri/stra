<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hljóðstrá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --grain:none;
  --paper:#12142A; --card:#22264A; --ink:#F3EEE4; --ink-soft:#A9A8C8; --line:rgba(243,238,228,.2);
  --pink:#FF48B0; --blue:#0078BF; --yellow:#FFE800; --aqua:#5EC8E5;
  --mis:#FF48B0; --mis2:#5EC8E5; --c:#FF48B0;
  --pill-1:26px 34px 28px 38px / 34px 26px 38px 28px;
  --pill-2:36px 26px 38px 28px / 26px 36px 28px 38px;
  --bub-1:52% 48% 55% 45% / 48% 54% 46% 52%;
  --bub-2:46% 54% 44% 56% / 55% 45% 53% 47%;
  --blob-2:60px 44px 64px 46px / 46px 60px 44px 58px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background-color:var(--paper);background-image:var(--grain);color:var(--ink);
  font-family:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;transition:transform .18s cubic-bezier(.3,1.6,.5,1),background-color .25s,color .25s}
button:active{transform:scale(.94)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hidden{display:none !important}

/* ---------- Header ---------- */
.bar{position:relative;z-index:2;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:12px 18px 10px}
.play{width:62px;height:62px;border-radius:var(--bub-1);background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none;box-shadow:2px 3px 0 color-mix(in srgb,var(--mis) 75%,transparent)}
.play svg{width:24px;height:24px}
.play .i-stop{display:none}
.play.on .i-play{display:none}
.play.on .i-stop{display:block}
.tempo{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--ink-soft)}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:6px 10px 7px 9px;background:var(--line);width:150px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:var(--bub-1);background:var(--ink);border:4px solid var(--card);box-shadow:1.5px 1.5px 0 var(--mis)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:4px solid var(--card)}
.chipbtn{display:flex;align-items:center;gap:9px;padding:10px 17px;border-radius:var(--pill-2);background-color:var(--card);background-image:var(--grain);font-weight:600;font-size:16px;box-shadow:2px 2px 0 color-mix(in srgb,var(--mis2) 55%,transparent);font-variant-numeric:tabular-nums}
.rdot{width:14px;height:14px;border-radius:50%;background:var(--pink);flex:none}
.chipbtn.on{background:var(--pink);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.chipbtn.on .rdot{background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.spacer{flex:1}
#songRec:not(.on){display:none}
.iconbtn{width:48px;height:48px;border-radius:var(--bub-2);display:grid;place-items:center;flex:none;background-color:var(--card);background-image:var(--grain);box-shadow:2px 2px 0 color-mix(in srgb,var(--mis2) 55%,transparent)}
.iconbtn svg{width:23px;height:23px}
.iconbtn[disabled]{opacity:.35;box-shadow:none}
.menu{position:fixed;z-index:31;width:min(92vw,290px);background-color:var(--card);background-image:var(--grain);border-radius:var(--blob-2);padding:10px;box-shadow:0 12px 34px rgba(0,0,0,.5),4px 5px 0 rgba(255,72,176,.35);display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:var(--pill-2);font-size:16px;font-weight:500}
.menu button svg{width:22px;height:22px;flex:none;color:var(--ink-soft)}
.menu button .rdot{margin:0 4px}
.menu button.warn{color:#FF7A6B;font-weight:600}
.menu button.warn svg{color:#FF7A6B}
.menu hr{border:0;border-top:2px dashed var(--line);margin:6px 8px}
.pwave{position:relative;height:66px;border-radius:18px 24px 18px 26px / 22px 18px 26px 18px;background:var(--paper);overflow:hidden;touch-action:none;cursor:ew-resize;margin-bottom:10px}
.pwave canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.psel{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--c) 28%,transparent);box-shadow:0 0 0 2000px rgba(8,9,20,.6)}
.phnd{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ink)}
.phnd::after{content:"";position:absolute;top:50%;left:50%;width:18px;height:30px;margin:-15px 0 0 -9px;border-radius:9px;background:var(--ink);box-shadow:inset 0 0 0 3px var(--c)}
.listen[disabled]{opacity:.55}
.listen,.share{display:flex;align-items:center;gap:8px}
.listen svg,.share svg,.done svg{width:20px;height:20px;display:block}
.tempo svg{width:24px;height:24px;flex:none}
.menu{width:min(94vw,300px);padding:12px}
.menu button{justify-content:center}
.menu button svg{width:26px;height:26px;color:inherit}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu{width:min(94vw,232px)}
.bar .add{position:static;width:58px;height:58px;flex:none}
/* the library drops down from the top, so the soil where the seeds land stays in view */
#libSheet{top:calc(env(safe-area-inset-top,0px) + 82px);bottom:auto;padding:16px 20px 18px;border-radius:44px 60px 50px 66px / 40px 50px 44px 54px;transform:translateY(-140%);box-shadow:0 10px 34px rgba(0,0,0,.5),4px 5px 0 rgba(255,72,176,.3)}
#libSheet.on{transform:none}
#libSheet .lib{max-height:min(44vh,430px)}
.bigbtn{width:58px;height:58px;flex:none;display:grid;place-items:center;border-radius:var(--bub-1);background-color:var(--card);background-image:var(--grain);box-shadow:2px 3px 0 color-mix(in srgb,var(--mis2) 55%,transparent)}
.bigbtn:nth-of-type(even){border-radius:var(--bub-2)}
.bigbtn svg{width:36px;height:36px;display:block}
@media (max-width:640px){ .bar .add{width:50px;height:50px} .bigbtn{width:50px;height:50px} .bigbtn svg{width:30px;height:30px} }
.mgrid button{height:58px;padding:0;background-color:var(--paper);background-image:var(--grain)}
.mgrid button:nth-child(odd){border-radius:var(--bub-1)} .mgrid button:nth-child(even){border-radius:var(--bub-2)}
.mgrid .rdot{width:22px;height:22px;margin:0}
.menu .mseg{margin:10px 0 0;display:flex}
.menu .mseg button{flex:1;padding:9px 0;justify-content:center;color:var(--ink)}
.menu .mseg button svg{width:30px;height:30px}
.menu button.warn{background:var(--pink);color:#fff}
.toast svg{width:34px;height:34px;display:block}
.toast{padding:12px 16px}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(255,232,0,0)}50%{box-shadow:0 0 0 13px rgba(255,232,0,.38)}}
.nudge{animation:nudge 1.5s ease-in-out infinite}
.ltabs{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.ltabs button{width:62px;height:54px;display:grid;place-items:center;background-color:var(--paper);background-image:var(--grain);border-radius:var(--pill-2)}
.ltabs button svg{width:38px;height:38px}
.ltabs button.on{box-shadow:0 0 0 3px var(--ink)}
.lib .lgrid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px;margin-bottom:18px}
.lib .ltile{position:relative;display:block;aspect-ratio:1;background:none;box-shadow:none;overflow:visible;border-radius:0}
.lib .lplay{width:100%;height:100%;padding:4px;display:block}
.lib .lplay svg{width:100%;height:100%;color:inherit;overflow:visible}
.lib .ladd{position:absolute;right:-4px;bottom:-4px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);box-shadow:2px 2px 0 var(--pink)}
.lib .ladd svg{width:16px;height:16px}
.lib .ltile.hit{box-shadow:none}
.lib .ltile.hit .lplay{transform:scale(1.15)}
#libSheet{max-width:860px}
#libSheet h2{margin:0;font-size:22px;font-weight:600;flex:1;text-shadow:1px 1px 0 color-mix(in srgb,var(--mis) 45%,transparent)}
.lib{max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:8px;padding:2px 6px 6px 2px}
.lib h3{margin:14px 0 8px;font-size:15px;font-weight:500;color:var(--ink-soft)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px}
.ltile{display:flex;align-items:stretch;background-color:var(--paper);background-image:var(--grain);border-radius:var(--pill-1);overflow:hidden;box-shadow:2px 2px 0 var(--line)}
.ltile:nth-child(even){border-radius:var(--pill-2)}
.lplay{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:12px 6px 12px 14px;text-align:left;font-size:15px;font-weight:500}
.lplay svg{width:15px;height:15px;flex:none;color:var(--ink-soft)}
.lplay span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ladd{width:48px;flex:none;display:grid;place-items:center;background:var(--pink);color:#fff}
.ladd svg{width:20px;height:20px}
.ltile.hit{box-shadow:0 0 0 3px var(--yellow)}
.pvol{display:flex;align-items:center;gap:10px;margin:0 2px 12px;color:var(--ink-soft)}
.pvol svg{width:24px;height:24px;flex:none}
.pvol input{flex:1;width:auto;min-width:0}
.textbtn{font-size:14px;color:var(--ink-soft);padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
.textbtn.warn{color:#FF7A6B;font-weight:600}

/* ---------- Field ---------- */
main{position:relative;z-index:1;flex:1;min-height:0;display:flex}
.field{
  position:relative;flex:1;min-height:200px;margin:2px 14px 14px;overflow:hidden;
  border-radius:54px 78px 62px 84px / 70px 52px 80px 60px;
  background:var(--grain),radial-gradient(120% 85% at 50% 104%,#323876 0%,#22264F 38%,#161934 72%,#101226 100%);
  box-shadow:inset 0 0 0 3px rgba(243,238,228,.07),5px 6px 0 rgba(255,72,176,.22);
}
.soil{position:absolute;left:0;right:0;bottom:0;height:96px;pointer-events:none;
  background:radial-gradient(circle,rgba(243,238,228,.1) 1px,transparent 1.6px) 0 0/9px 9px,#0A0B18;
  border-radius:58% 42% 0 0 / 22px 30px 0 0;box-shadow:0 -3px 0 rgba(94,200,229,.28)}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.add{position:absolute;left:16px;bottom:16px;z-index:3;width:60px;height:60px;border-radius:var(--bub-2);background:var(--pink);color:#fff;display:grid;place-items:center;
  box-shadow:3px 3px 0 var(--blue);transform:scale(var(--rl,1))}
.add svg{width:28px;height:28px}
.add .i-sq{display:none}
.add.on{background:var(--ink);color:var(--pink);box-shadow:0 0 0 6px rgba(255,72,176,.35),3px 3px 0 var(--pink);transition:none}
.add.on .i-plus{display:none}
.add.on .i-sq{display:block;animation:blink 1s steps(2) infinite}
.hint{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:2;max-width:min(86%,520px);text-align:center;font-size:18px;line-height:1.35;color:var(--ink);
  background:rgba(10,11,24,.55);padding:9px 18px;border-radius:var(--pill-1);pointer-events:none;transition:opacity .5s;text-shadow:1px 1px 0 color-mix(in srgb,var(--mis) 45%,transparent)}
.hint:empty{opacity:0}

/* ---------- Seed popover ---------- */
.scrim{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,6,14,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.clear{background:transparent}
.pop{position:fixed;z-index:31;background-color:var(--card);background-image:var(--grain);border-radius:var(--blob-2);padding:14px;box-shadow:0 12px 34px rgba(0,0,0,.5),4px 5px 0 color-mix(in srgb,var(--c) 55%,transparent);width:264px;display:none}
.pop.on{display:block}
.pfx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pfx button,.pact button{height:56px;display:grid;place-items:center;background-color:var(--paper);background-image:var(--grain);color:var(--ink)}
.pfx button:nth-child(3n){border-radius:var(--bub-1)} .pfx button:nth-child(3n+1){border-radius:var(--bub-2)} .pfx button:nth-child(3n+2){border-radius:var(--pill-1)}
.pfx button svg{width:34px;height:34px}
.pfx button.on{background:var(--c);color:#14172B;box-shadow:2px 2px 0 var(--ink)}
.pact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line)}
.pact button{height:46px;border-radius:var(--pill-2);color:var(--ink-soft)}
.pact button svg{width:22px;height:22px}
.pact button[disabled]{opacity:.3}
.pact button.warn{background:var(--pink);color:#fff}

/* ---------- Song sheet ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;z-index:21;background-color:var(--card);background-image:var(--grain);border-radius:48px 66px 0 0 / 40px 54px 0 0;
  padding:18px 22px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .32s cubic-bezier(.3,1.1,.4,1);box-shadow:0 -8px 30px rgba(0,0,0,.45)}
.sheet.on{transform:none}
.ed-top{display:flex;align-items:center;gap:14px}
.ed-top input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:600;color:var(--ink);background:var(--paper);border:0;border-radius:var(--pill-2);padding:9px 14px;-webkit-user-select:text;user-select:text}
.done{background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:var(--pill-1);font-weight:600;box-shadow:2px 2px 0 color-mix(in srgb,var(--mis) 70%,transparent)}
.sheet audio{width:100%;margin-top:14px}
.ed-act{display:flex;gap:10px;align-items:center;margin-top:12px}
.listen{background:var(--yellow);color:#14172B;padding:11px 20px;border-radius:var(--pill-2);font-weight:600;font-size:17px;box-shadow:2px 2px 0 var(--pink)}
.share{font-size:16px;font-weight:500;padding:11px 18px;border-radius:var(--pill-1);background:var(--paper)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:60;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:var(--pill-1);max-width:min(90vw,520px);text-align:center;font-size:16px;line-height:1.35;transition:transform .3s,opacity .3s;pointer-events:none;box-shadow:2px 2px 0 var(--mis)}
.toast.on{transform:translate(-50%,0);opacity:1}
@media (max-width:640px){ .bar{padding:10px 12px 8px;gap:8px 12px} .field{margin:2px 8px 8px} input[type=range]{width:84px} .tempo{font-size:14px;gap:6px} }
.menu{width:min(94vw,330px)}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;font-size:15px;color:var(--ink-soft)}
.mseg{display:flex;margin-left:auto;background:var(--paper);border-radius:var(--pill-2);padding:3px}
.menu .mseg button{width:auto;padding:8px 11px;font-size:14px;gap:0;border-radius:var(--pill-1);color:var(--ink-soft)}
.menu .mseg button.on{background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:reduce){ button:active{transform:none} }
</style>
</head>
<body>
<header class="bar">
  <button id="playBtn" class="play" aria-label="Spila">
    <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 001.5.86l12-7.5a1 1 0 000-1.72l-12-7.5A1 1 0 007 4.5z"/></svg>
    <svg class="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
  </button>
  <label class="tempo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l4 18H5z"/><path d="M12 16l5.5-10"/><path d="M7.2 16h9.6"/></svg> <input id="bpm" type="range" min="50" max="170" step="1" value="92" aria-label="Hraði"></label>
  <label class="tempo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.7 7.7a2.5 2.5 0 111.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1111 8H2"/><path d="M12.6 19.4A2 2 0 1014 16H2"/></svg> <input id="wind" type="range" min="0" max="1" step="0.01" value="0.3" aria-label="Vindur"></label>
  <button id="songRec" class="chipbtn" data-label="" aria-label="Stoppa upptöku"><span class="rdot"></span><span class="rtxt"></span></button>
  <span class="spacer"></span>
  <button id="addBtn" class="add" aria-label="Taka upp nýtt hljóð">
    <svg class="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <svg class="i-sq" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
  </button>
  <button id="libBtn" class="bigbtn" aria-label="Hljóðasöfn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="4.2" fill="#FF48B0"/><path d="M17 2l1.7 3.3L22 7l-3.3 1.7L17 12l-1.7-3.3L12 7l3.3-1.7z" fill="#FFE800"/><rect x="3" y="13.5" width="8" height="8" rx="2.4" fill="#5EC8E5"/><path d="M17 13l4.6 8.2h-9.2z" fill="#00A95C"/></svg></button>
  <button id="scaleBtn" class="bigbtn"></button>
  <button id="skyBtn" class="bigbtn"></button>
  <button id="undoBtn" class="iconbtn" disabled aria-label="Afturkalla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
  <button id="gearBtn" class="iconbtn" aria-label="Stillingar" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 2.2v3" transform="rotate(0 12 12)"/><path d="M12 2.2v3" transform="rotate(45 12 12)"/><path d="M12 2.2v3" transform="rotate(90 12 12)"/><path d="M12 2.2v3" transform="rotate(135 12 12)"/><path d="M12 2.2v3" transform="rotate(180 12 12)"/><path d="M12 2.2v3" transform="rotate(225 12 12)"/><path d="M12 2.2v3" transform="rotate(270 12 12)"/><path d="M12 2.2v3" transform="rotate(315 12 12)"/><circle cx="12" cy="12" r="6" stroke-width="2.4"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>
  <input id="fileIn" type="file" accept="audio/*" class="hidden">
</header>

<main>
  <div id="field" class="field">
    <div id="soil" class="soil"></div>
    <canvas id="cv" aria-label="Hljóðstrá: fræ, stilkar og hljóð"></canvas>
    <div id="hint" class="hint" role="status"></div>
  </div>
</main>

<div id="popScrim" class="scrim clear"></div>
<div id="pop" class="pop" role="dialog" aria-label="Hljóðið">
  <div id="pwave" class="pwave" aria-label="Klippa hljóðið"><canvas id="pcv"></canvas><div id="psel" class="psel"></div><div id="phS" class="phnd"></div><div id="phE" class="phnd"></div></div>
  <label class="pvol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 010 6M18.3 6.3a8 8 0 010 11.4"/></svg><input id="pVol" type="range" min="0" max="1.5" step="0.01" value="1" aria-label="Styrkur hljóðsins"></label>
  <div class="pfx" id="pfx"></div>

    setSong(mp3, 'mp3'); btn.innerHTML = DL_ICON + '<span>MP3</span>';
  }, function(){
    if (songBlob !== blob) return;
    btn.innerHTML = DL_ICON + '<span>' + ext + '</span>'; toast('Ekki tókst að búa til MP3 í þessum vafra. Lagið vistast sem ' + ext + ' í staðinn.');
  }).then(function(){ btn.disabled = false; btn.dataset.ext = songExt; btn.dataset.size = songBlob ? songBlob.size : 0; });
}
function closeSong(){ $('#songSheet').classList.remove('on'); $('#scrim').classList.remove('on'); try { $('#songAudio').pause(); } catch(e){} }
function songFilename(){ return (($('#songName').value.trim() || 'Hljóðstrá').replace(/[\\\/:*?"<>|]+/g, '').slice(0, 60) || 'Hljóðstrá') + '.' + songExt; }
function anchorSave(fn){ var a = document.createElement('a'); a.href = songURL; a.download = fn; document.body.appendChild(a); a.click(); a.remove(); }
async function saveSong(){
  if (!songBlob) return;
  var fn = songFilename();
  if (dl){
    try { await dl.save({filename:fn, data:songBlob}); toast('Lagið var vistað.'); }
    catch(e){
      var c = e && e.code;
      if (c === 'declined') return;
      if (c === 'rate_limited'){ toast('Bíddu andartak og reyndu aftur.'); return; }
      if (c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed'){ dl = null; anchorSave(fn); return; }
      toast('Ekki tókst að vista lagið.');
    }
    return;
  }
  anchorSave(fn);
}
$('#songRec').addEventListener('click', function(){ if (songRec){ stopSong(); if (playing) stop(); } else startSong(); });
$('#songSave').addEventListener('click', saveSong);
$('#songShare').addEventListener('click', function(){
  if (!songBlob) return;
  var f = new File([songBlob], songFilename(), {type:songBlob.type});
  navigator.share({files:[f], title:$('#songName').value || 'Hljóðstrá'}).catch(function(){});
});
$('#songClose').addEventListener('click', closeSong);
$('#scrim').addEventListener('click', function(){ closeSong(); closeLib(); });

/* ================= Sound libraries =================
   Each library is a tab; every sound in it has its own shape and colour, and keeps them when planted.
   To add a library: push another {id, name, icon, items:[{n, g, sh, col, d (base64 audio) or gen()}]} here. */
var LSR = 44100, TAU = Math.PI*2;
function mkSnd(sec, fn){ var n = Math.floor(LSR*sec), d = new Float32Array(n); for (var i=0;i<n;i++) d[i] = fn(i/LSR, i/n); return d; }
var LGROUP = {'Bassatromma':{sh:0, h:325}, 'Snerill':{sh:1, h:20}, 'Hi-hat':{sh:7, h:50}, 'Tom og bongó':{sh:4, h:352}, 'Annað':{sh:2, h:275}};
var LIBRARIES = [
  {id:'trommur', name:'Trommur', icon:{sh:0, col:'hsl(325,96%,62%)'}, items:(function(){
    var cnt = {};
    return (window.HS_LIB || []).map(function(it){ var G = LGROUP[it.g] || {sh:2, h:200}, i = cnt[it.g] = (cnt[it.g] || 0) + 1;
      return {n:it.g + ', ' + it.n, g:it.g, d:it.d, sh:G.sh, col:'hsl(' + (G.h + (i - 1)*7) + ',96%,' + (56 + (i - 1)*6) + '%)'}; });
  })()},
  {id:'gamalt', name:'Gamlar trommuvélar og hljómborð', icon:{sh:4, col:'hsl(100,85%,58%)'}, items:(function(){
    var GR = {'Bassatromma':{sh:0, h:98}, 'Snerill':{sh:1, h:150}, 'Klapp':{sh:7, h:172}, 'Tom':{sh:4, h:125}, 'Tambúrína':{sh:5, h:70}, 'Hljómborð':{sh:3, h:292}}, cnt = {};
    return (window.HS_LIB2 || []).map(function(it){ var G = GR[it.g] || {sh:2, h:200}, i = cnt[it.g] = (cnt[it.g] || 0) + 1;
      return {n:it.g + ', ' + it.n, g:it.g, d:it.d, sh:G.sh, col:'hsl(' + (G.h + (i - 1)*9) + ',85%,' + (56 + (i - 1)*7) + '%)'}; });
  })()},
  {id:'tonar', name:'Tónar', icon:{sh:5, col:'hsl(185,90%,62%)'}, items:[
    {n:'Pling', g:'a', sh:5, col:'hsl(185,90%,62%)', gen:function(){ return mkSnd(1.6, function(t){ return Math.exp(-t*3.2)*(Math.sin(TAU*523.25*t) + 0.4*Math.sin(TAU*1046.5*t + 0.3) + 0.15*Math.sin(TAU*1569.8*t))*0.5; }); }},
    {n:'Bjalla', g:'a', sh:3, col:'hsl(160,85%,60%)', gen:function(){ return mkSnd(2.2, function(t){ return Math.exp(-t*2.1)*Math.sin(TAU*660*t + 2.4*Math.exp(-t*3)*Math.sin(TAU*660*2.76*t))*0.6; }); }},
    {n:'Plokk', g:'a', sh:1, col:'hsl(210,95%,68%)', gen:function(){ var N = Math.round(LSR/196), n = Math.floor(LSR*1.5), d = new Float32Array(n), i;
      for (i=0;i<N;i++) d[i] = Math.random()*2 - 1; for (i=N+1;i<n;i++) d[i] = 0.4975*(d[i-N] + d[i-N-1]); return d; }},
    {n:'Dropi', g:'b', sh:0, col:'hsl(235,95%,76%)', gen:function(){ return mkSnd(0.3, function(t){ return Math.exp(-t*16)*Math.sin(TAU*(420*t + 2400*t*t))*0.9; }); }},
    {n:'Dynkur', g:'b', sh:4, col:'hsl(262,90%,72%)', gen:function(){ return mkSnd(0.5, function(t){ return Math.exp(-t*11)*Math.sin(TAU*(55*t + 90*(1 - Math.exp(-t*30))/30))*0.9; }); }},
    {n:'Vindhviða', g:'b', sh:6, col:'hsl(140,70%,62%)', gen:function(){ var lp = 0; return mkSnd(1.4, function(t, x){ lp += ((Math.random()*2 - 1) - lp)*0.12; return lp*Math.pow(Math.sin(Math.PI*x), 2)*1.6; }); }}
  ]}
];
var libCur = 0;
function libDecode(it){
  if (it.p) return it.p;
  ensureCtx();
  it.p = new Promise(function(res, rej){
    if (it.gen){ var d0 = it.gen(), b0 = ctx.createBuffer(1, d0.length, LSR); b0.getChannelData(0).set(d0); res({data:d0, sr:LSR, buffer:b0}); return; }
    var bin = atob(it.d), u8 = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
    ctx.decodeAudioData(u8.buffer, function(b){
      var d = new Float32Array(b.length), ch = b.numberOfChannels;
      for (var c=0;c<ch;c++){ var x = b.getChannelData(c); for (var k=0;k<d.length;k++) d[k] += x[k]/ch; }
      res({data:d, sr:b.sampleRate, buffer:b});
    }, rej);
  });
  it.p.catch(function(){ it.p = null; });
  return it.p;
}
var libVoice = null;
function libPlay(it, tile){
  libDecode(it).then(function(o){
    try { if (libVoice) libVoice.stop(); } catch(e){}
    var src = ctx.createBufferSource(), gn = gainNode(0.9); src.buffer = o.buffer; src.connect(gn); gn.connect(A.master); src.start(); libVoice = src;
    tile.classList.add('hit'); setTimeout(function(){ tile.classList.remove('hit'); }, 220);
  }, function(){ toast('Ekki tókst að spila hljóðið.'); });
}
function libAdd(it){
  if (freeSlot() < 0){ toast('Moldin er full. Eyddu einu fræi til að búa til pláss.'); return; }
  libDecode(it).then(function(o){
    try { if (libVoice) libVoice.stop(); } catch(e){}
    if (addSound(new Float32Array(o.data), o.sr, {col:it.col, shp:it.sh})) toast(it.n + ' er komið í moldina.');
  }, function(){ toast('Ekki tókst að lesa hljóðið.'); });
}
function buildLib(){
  var tabs = $('#libTabs'); tabs.innerHTML = '';
  LIBRARIES.forEach(function(L, i){
    var b = document.createElement('button'); b.className = i === libCur ? 'on' : ''; b.setAttribute('role', 'tab'); b.setAttribute('aria-label', L.name); b.setAttribute('aria-selected', i === libCur ? 'true' : 'false');
    b.innerHTML = shapeSVG(L.icon.sh, L.icon.col);
    b.addEventListener('click', function(){ libCur = i; buildLib(); });
    tabs.appendChild(b);
  });
  var wrap = $('#lib'), cur = null, grid = null; wrap.innerHTML = '';
  LIBRARIES[libCur].items.forEach(function(it){
    if (it.g !== cur){ cur = it.g; grid = document.createElement('div'); grid.className = 'lgrid'; wrap.appendChild(grid); }
    var t = document.createElement('div'); t.className = 'ltile';
    t.innerHTML = '<button class="lplay">' + shapeSVG(it.sh, it.col) + '</button><button class="ladd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>';
    t.querySelector('.lplay').setAttribute('aria-label', 'Hlusta á ' + it.n);
    t.querySelector('.ladd').setAttribute('aria-label', 'Setja ' + it.n + ' í moldina');
    t.querySelector('.lplay').addEventListener('click', function(){ libPlay(it, t); });
    t.querySelector('.ladd').addEventListener('click', function(){ libAdd(it); });
    grid.appendChild(t);
  });
}
buildLib();
function openLib(){ closeMenu(); ensureCtx(); $('#libSheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeLib(){ $('#libSheet').classList.remove('on'); if (!$('#songSheet').classList.contains('on')) $('#scrim').classList.remove('on'); try { if (libVoice) libVoice.stop(); } catch(e){} }
$('#libBtn').addEventListener('click', openLib);
$('#libClose').addEventListener('click', closeLib);

/* ================= Storage (this device only) ================= */
var db = null, saveT = 0;
function dbOpen(){
  return new Promise(function(res){
    try {
      var rq = indexedDB.open('hljodstra', 1);
      rq.onupgradeneeded = function(){ var d = rq.result;
        if (!d.objectStoreNames.contains('sounds')) d.createObjectStore('sounds', {keyPath:'id'});
        if (!d.objectStoreNames.contains('state')) d.createObjectStore('state'); };
      rq.onsuccess = function(){ db = rq.result; res(db); };
      rq.onerror = function(){ res(null); }; rq.onblocked = function(){ res(null); };
    } catch(e){ res(null); }
  });
}
function tx(store, md, fn){
  if (!db) return Promise.resolve(null);
  return new Promise(function(res){
    try { var t = db.transaction(store, md), r = fn(t.objectStore(store));
      t.oncomplete = function(){ res(r && r.result); }; t.onerror = function(){ res(null); }; t.onabort = function(){ res(null); };
    } catch(e){ res(null); }
  });
}
function dbPut(s){
  tx('sounds','readwrite', function(st){ return st.put({id:s.id, data:s.data, sr:s.sr, start:s.start, end:s.end, norm:s.norm, slot:s.slot, v:s.v, fx:s.fx, vol:volOf(s), mute:!!s.mute, smear:s.smear || null, col:s.col, shp:s.shp, pts:s.pts, N:s.N, t:s.t,
    buds:s.buds.map(function(b){ return {u:b.u, m:b.m ? 1 : 0, cx:b.cx || 0, cy:b.cy || 0}; })}); });
}
function dbDel(id){ tx('sounds','readwrite', function(st){ return st.delete(id); }); }
function saveState(){ clearTimeout(saveT); saveT = setTimeout(function(){ tx('state','readwrite', function(st){ return st.put({bpm:S.bpm, wind:S.wind, scale:S.scale, sky:S.sky}, 'main'); }); }, 300); }
async function loadAll(){
  await dbOpen();
  var list = await tx('sounds','readonly', function(st){ return st.getAll(); }) || [];
  list.sort(function(a,b){ return a.t - b.t; });
  list.forEach(function(o){
    if (!o || !o.data || sounds.some(function(s){ return s.slot === o.slot; })) return;
    o.dur = o.data.length/o.sr; if (!(o.smear && o.smear.u1 > o.smear.u0)) o.smear = null; o.buds = (o.buds || []).map(function(b){ return {u:typeof b.u === 'number' ? b.u : clamp(b.j/(2*(o.N || 8)), 0.02, 1), m:b.m ? 1 : 0, cx:+b.cx || 0, cy:+b.cy || 0, pop:0}; });
    o.ph = Math.random()*6.28; o.pop = 0; o.shake = 0; o.wv = waveBars(o);
    if (o.fx && !FX[o.fx]) o.fx = null;
    sounds.push(o);
  });
  var st = await tx('state','readonly', function(s){ return s.get('main'); });
  if (st && st.bpm){ S.bpm = st.bpm; $('#bpm').value = S.bpm; }
  if (st && typeof st.wind === 'number') S.wind = st.wind;
  if (st && (SCALES[st.scale] || st.scale === 'none')) S.scale = st.scale;
  if (st && /^(day|night|auto)$/.test(st.sky)) S.sky = st.sky;
  syncMenu();
  sounds.forEach(buildGeo); updateHint();
}

/* ================= Wiring ================= */
$('#playBtn').addEventListener('click', function(){ playing ? stop() : play(); });
$('#bpm').addEventListener('input', function(e){ S.bpm = +e.target.value; syncDelay(); saveState(); });
$('#addBtn').addEventListener('click', function(){ if (rec) stopRec(); else startRec(); });
$('#fileBtn').addEventListener('click', function(){ closeMenu(); $('#fileIn').click(); });
$('#fileIn').addEventListener('change', function(e){ var f = e.target.files && e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
var resetArmed = false;
$('#resetBtn').addEventListener('click', function(){
  var btn = $('#resetBtn');
  if (!resetArmed){ resetArmed = true; btn.classList.add('warn');
    setTimeout(function(){ resetArmed = false; btn.classList.remove('warn'); }, 4000); return; }
  resetArmed = false; btn.classList.remove('warn'); closeMenu();
  if (rec) stopRec(); if (playing) stop(); closePop();
  if (sounds.length) pushUndo();
  sounds.slice().forEach(removeSound); everPlayed = false; updateHint();
  toast('Öllu var eytt. Ýttu á Afturkalla ef þetta var óvart.');
});
document.addEventListener('keydown', function(e){
  var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON')) return;
  if (e.key === ' '){ e.preventDefault(); playing ? stop() : play(); }
  if (e.key === 'Escape'){ closePop(); closeMenu(); }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); undo(); }
});
// iOS needs audio to be unlocked inside a gesture
['pointerdown','touchend','click'].forEach(function(ev){
  document.addEventListener(ev, function(){ if (ctx && ctx.state !== 'running') ctx.resume(); }, {passive:true});
});
(function makeGrain(){
  try {
    var c = document.createElement('canvas'); c.width = c.height = 140;
    var x = c.getContext('2d'); if (!x) return;
    var im = x.createImageData(140, 140), d = im.data;
    for (var i=0;i<d.length;i+=4){
      var r = Math.random();
      if (r < 0.18){ d[i]=0; d[i+1]=0; d[i+2]=10; d[i+3] = 8 + Math.random()*22; }
      else if (r < 0.26){ d[i]=255; d[i+1]=250; d[i+2]=240; d[i+3] = 5 + Math.random()*13; }
    }
    x.putImageData(im, 0, 0);
    document.documentElement.style.setProperty('--grain', 'url(' + c.toDataURL('image/png') + ')');
  } catch(e){}
})();
makeDots(); layout(); updateHint();
if (window.ResizeObserver) new ResizeObserver(layout).observe(field); else window.addEventListener('resize', layout);
loadAll();
requestAnimationFrame(frame);
})();
</script>
